---
kind: VirtualKafkaCluster
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: my-cluster
spec:
  proxyRef:
    name: my-proxy
  targetKafkaServiceRef:
    name: my-cluster
  ingresses:
    - ingressRef:
        name: my-ingress
      tls:
        certificateRef:
          name: my-cluster-server-certificate
          kind: Secret
