---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafkasql-journal
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 2
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafkasql-snapshots
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 2
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: registry-events
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 2
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: apicurio-registry
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: kafkasql-journal
        patternType: literal
      operations:
      - Read
      - Write
    - resource:
        type: group
        name: apicurio-
        patternType: prefix
      operations:
      - Read
    - resource:
        type: topic
        name: kafkasql-snapshots
        patternType: literal
      operations:
      - Read
      - Write
    - resource:
        type: topic
        name: registry-events
        patternType: literal
      operations:
      - Read
      - Write
